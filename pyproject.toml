[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openathlete-mcp"
version = "0.1.1"
description = "OpenAthlete — 统一运动数据层（佳明/高驰）与 AI 训练助手工具集"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["garmin", "coros", "fitness", "training", "mcp"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27,<1",
    "garmin-fit-sdk>=21.0",
    "garth==0.4.38",
    "tomli>=1.2; python_version < '3.11'",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "tzlocal>=5.3,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/whz14/openathlete"
Repository = "https://github.com/whz14/openathlete"
Issues = "https://github.com/whz14/openathlete/issues"

[project.scripts]
openathlete-mcp = "openathlete.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openathlete"]
